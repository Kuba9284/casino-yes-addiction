<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Clear 99G1C dbgUsed (Debug Log)</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #07120d;
      --card: #102219;
      --border: #2c5541;
      --gold: #f0c04e;
      --text: #eef6f1;
      --muted: #98b5a6;
      --good: #7ef0b0;
      --warn: #ffd269;
      --err: #ff8a8a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      font: 500 15px/1.45 system-ui, -apple-system, sans-serif;
      background: radial-gradient(circle at 50% 25%, #163d2b, var(--bg) 75%);
      color: var(--text);
    }
    .card {
      width: min(560px, 100%);
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 22px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.55);
    }
    h1 {
      margin: 0 0 8px;
      font-size: 22px;
      color: var(--gold);
    }
    p {
      margin: 0 0 14px;
      color: var(--muted);
    }
    .label {
      margin: 0 0 6px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .box {
      background: rgba(0, 0, 0, 0.34);
      border: 1px solid rgba(255, 255, 255, 0.09);
      border-radius: 10px;
      padding: 12px 14px;
      margin-bottom: 14px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 12.5px;
      line-height: 1.45;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .log-box {
      max-height: 240px;
      overflow-y: auto;
      margin-bottom: 16px;
    }
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }
    button {
      border: 0;
      border-radius: 10px;
      padding: 11px 15px;
      font: 700 14px/1 system-ui, sans-serif;
      cursor: pointer;
    }
    .primary {
      background: linear-gradient(180deg, #ffe79e, #d4a135);
      color: #1c1202;
    }
    .secondary {
      background: #1b3629;
      color: var(--text);
      border: 1px solid var(--border);
    }
    .note {
      margin-top: 14px;
      margin-bottom: 0;
      font-size: 12.5px;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>99G1C Save Cleaner</h1>
    <p>Clears <code>dbgUsed</code> from <code>localStorage</code> under key <code>99g1c-v1</code> with step-by-step debug logging.</p>

    <div class="label">Status</div>
    <div id="status" class="box">Booting script...</div>

    <div class="label">Debug Log</div>
    <div id="log" class="box log-box"></div>

    <div class="actions">
      <button id="clearBtn" class="primary" type="button">Clear dbgUsed</button>
      <button id="refreshBtn" class="secondary" type="button">Check Status</button>
      <button id="copyLogBtn" class="secondary" type="button">Copy Log</button>
    </div>

    <p class="note">
      Note: <code>localStorage</code> is isolated per origin/URL. Open this file on the same origin/path where you play 99G1C.
    </p>
  </main>

  <script>
    const SAVE_KEY = '99g1c-v1';
    const statusEl = document.getElementById('status');
    const logEl = document.getElementById('log');
    const t0 = performance.now();
    const logLines = [];

    function stamp() {
      return '+' + (performance.now() - t0).toFixed(1) + 'ms';
    }

    function dbg(step, msg) {
      const line = '[' + stamp() + '] [' + step + '] ' + msg;
      logLines.push(line);
      if (logEl) {
        logEl.textContent = logLines.join('
');
        logEl.scrollTop = logEl.scrollHeight;
      }
      try { console.log(line); } catch (_) {}
    }

    window.addEventListener('error', (ev) => {
      dbg('WINDOW_ERROR', (ev.message || 'Unknown error') + ' @ ' + (ev.filename || '?') + ':' + (ev.lineno || '?'));
      if (statusEl) statusEl.textContent = 'Error captured — see Debug Log below.';
    });

    window.addEventListener('unhandledrejection', (ev) => {
      const reason = ev && ev.reason ? (ev.reason.stack || ev.reason.message || String(ev.reason)) : 'Unknown rejection';
      dbg('PROMISE_REJECTION', reason);
      if (statusEl) statusEl.textContent = 'Promise rejection captured — see Debug Log below.';
    });

    dbg('BOOT', 'Starting initialization; href=' + location.href + ' origin=' + location.origin);

    function readSave() {
      dbg('READ_SAVE', 'Calling localStorage.getItem("' + SAVE_KEY + '")');
      let raw = null;
      try {
        raw = localStorage.getItem(SAVE_KEY);
      } catch (err) {
        dbg('READ_SAVE_ERR', 'localStorage.getItem threw: ' + (err && err.message ? err.message : String(err)));
        return { exists: false, raw: null, data: null, accessError: err };
      }

      dbg('READ_SAVE', 'localStorage.getItem returned ' + (raw === null ? 'null' : 'string(' + raw.length + ' chars)'));
      if (raw === null) {
        return { exists: false, raw: null, data: null };
      }

      try {
        const parsed = JSON.parse(raw);
        dbg('JSON_PARSE', 'Parsed JSON successfully; top-level keys=' + Object.keys(parsed || {}).join(','));
        return { exists: true, raw, data: parsed };
      } catch (err) {
        dbg('JSON_PARSE_ERR', 'JSON.parse failed: ' + (err && err.message ? err.message : String(err)));
        return { exists: true, raw, data: null, parseError: err.message };
      }
    }

    function renderStatus(extraMsg) {
      dbg('RENDER_STATUS', 'Entering renderStatus(' + JSON.stringify(extraMsg || '') + ')');
      const info = readSave();
      const lines = [];
      if (extraMsg) lines.push(extraMsg);

      if (info.accessError) {
        lines.push('Storage access error: ' + (info.accessError.message || String(info.accessError)));
      } else if (!info.exists) {
        lines.push('No "' + SAVE_KEY + '" save found in this browser context.');
      } else if (info.parseError) {
        lines.push('Save exists, but JSON could not be parsed: ' + info.parseError);
      } else {
        const d = info.data || {};
        const hasS = !!(d.S && typeof d.S === 'object');
        const dbgVal = hasS ? d.S.dbgUsed : undefined;
        dbg('INSPECT_STATE', 'hasS=' + hasS + ' S.dbgUsed=' + JSON.stringify(dbgVal));
        lines.push('Save found: yes');
        lines.push('S object present: ' + (hasS ? 'yes' : 'no'));
        lines.push('Current S.dbgUsed: ' + (dbgVal === undefined ? 'undefined (clear)' : JSON.stringify(dbgVal)));
      }

      statusEl.textContent = lines.join('
');
      dbg('RENDER_STATUS', 'Status box updated');
    }

    function clearDbgUsed() {
      dbg('CLEAR_CLICK', 'Clear dbgUsed button clicked');
      const info = readSave();
      if (info.accessError || !info.exists) {
        renderStatus('Nothing to clear: "' + SAVE_KEY + '" is not present in localStorage here.');
        return;
      }
      if (info.parseError || !info.data || typeof info.data !== 'object') {
        renderStatus('Could not safely modify save because JSON is invalid.');
        return;
      }

      const data = info.data;
      if (data.S && typeof data.S === 'object' && 'dbgUsed' in data.S) {
        dbg('MUTATE', 'Deleting data.S.dbgUsed (was ' + JSON.stringify(data.S.dbgUsed) + ')');
        delete data.S.dbgUsed;
        try {
          const serialized = JSON.stringify(data);
          localStorage.setItem(SAVE_KEY, serialized);
          dbg('WRITE_SAVE', 'Saved updated "' + SAVE_KEY + '" (' + serialized.length + ' chars)');
          renderStatus('Cleared S.dbgUsed and saved "' + SAVE_KEY + '".');
        } catch (err) {
          dbg('WRITE_SAVE_ERR', 'localStorage.setItem failed: ' + (err && err.message ? err.message : String(err)));
          renderStatus('Failed to write updated save: ' + (err && err.message ? err.message : String(err)));
        }
      } else {
        dbg('MUTATE_SKIP', 'S.dbgUsed was already absent/cleared');
        renderStatus('S.dbgUsed was already absent/cleared.');
      }
    }

    document.getElementById('clearBtn').addEventListener('click', clearDbgUsed);
    document.getElementById('refreshBtn').addEventListener('click', () => {
      dbg('REFRESH_CLICK', 'Check Status button clicked');
      renderStatus();
    });
    document.getElementById('copyLogBtn').addEventListener('click', async () => {
      const text = logLines.join('
');
      dbg('COPY_LOG', 'Attempting to copy ' + logLines.length + ' log lines');
      try {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          await navigator.clipboard.writeText(text);
          dbg('COPY_LOG', 'Copied to clipboard');
          return;
        }
      } catch (_) {}
      const ta = document.createElement('textarea');
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); dbg('COPY_LOG', 'Copied via execCommand'); } catch (e) { dbg('COPY_LOG_ERR', String(e)); }
      ta.remove();
    });

    dbg('INIT', 'Event listeners attached; calling initial renderStatus()');
    renderStatus();
  </script>
</body>
</html>
