<doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Clear 99G1C dbgUsed</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #07120d;
      --card: #102219;
      --border: #2c5541;
      --gold: #f0c04e;
      --text: #eef6f1;
      --muted: #98b5a6;
      --good: #7ef0b0;
      --warn: #ffd269;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      font: 500 15px/1.45 system-ui, -apple-system, sans-serif;
      background: radial-gradient(circle at 50% 25%, #163d2b, var(--bg) 75%);
      color: var(--text);
    }
    .card {
      width: min(520px, 100%);
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 22px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.55);
    }
    h1 {
      margin: 0 0 8px;
      font-size: 22px;
      color: var(--gold);
    }
    p {
      margin: 0 0 14px;
      color: var(--muted);
    }
    .box {
      background: rgba(0, 0, 0, 0.28);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      padding: 12px 14px;
      margin-bottom: 16px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 13px;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }
    button {
      border: 0;
      border-radius: 10px;
      padding: 11px 16px;
      font: 700 14px/1 system-ui, sans-serif;
      cursor: pointer;
    }
    .primary {
      background: linear-gradient(180deg, #ffe79e, #d4a135);
      color: #1c1202;
    }
    .secondary {
      background: #1b3629;
      color: var(--text);
      border: 1px solid var(--border);
    }
    .ok { color: var(--good); }
    .warn { color: var(--warn); }
    .note {
      margin-top: 14px;
      font-size: 12.5px;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>99G1C Save Cleaner</h1>
    <p>Clears <code>dbgUsed</code> from <code>localStorage</code> under key <code>99g1c-v1</code> while keeping your balance, level, and stats.</p>
    <div id="status" class="box">Checking saved data...</div>
    <div class="actions">
      <button id="clearBtn" class="primary" type="button">Clear dbgUsed</button>
      <button id="refreshBtn" class="secondary" type="button">Check Status</button>
    </div>
    <p class="note">
      Note: Browsers isolate <code>localStorage</code> by origin/file path. Open this file from the same browser and origin/folder where you play 99G1C.
    </p>
  </main>

  <script>
    const SAVE_KEY = '99g1c-v1';
    const statusEl = document.getElementById('status');

    function readSave() {
      const raw = localStorage.getItem(SAVE_KEY);
      if (!raw) return { exists: false, raw: null, data: null };
      try {
        return { exists: true, raw, data: JSON.parse(raw) };
      } catch (err) {
        return { exists: true, raw, data: null, parseError: err.message };
      }
    }

    function renderStatus(extraMsg) {
      const info = readSave();
      const lines = [];
      if (extraMsg) lines.push(extraMsg);

      if (!info.exists) {
        lines.push('No "99g1c-v1" save found in this browser context.');
      } else if (info.parseError) {
        lines.push('Save exists, but JSON could not be parsed: ' + info.parseError);
      } else {
        const d = info.data || {};
        const hasS = !!(d.S && typeof d.S === 'object');
        const dbgVal = hasS ? d.S.dbgUsed : undefined;
        lines.push('Save found: yes');
        lines.push('S object present: ' + (hasS ? 'yes' : 'no'));
        lines.push('Current S.dbgUsed: ' + (dbgVal === undefined ? 'undefined (clear)' : JSON.stringify(dbgVal)));
      }

      statusEl.textContent = lines.join('
');
    }

    function clearDbgUsed() {
      const info = readSave();
      if (!info.exists) {
        renderStatus('Nothing to clear: "99g1c-v1" is not present in localStorage here.');
        return;
      }
      if (info.parseError || !info.data || typeof info.data !== 'object') {
        renderStatus('Could not safely modify save because JSON is invalid.');
        return;
      }

      const data = info.data;
      if (data.S && typeof data.S === 'object' && 'dbgUsed' in data.S) {
        delete data.S.dbgUsed;
        localStorage.setItem(SAVE_KEY, JSON.stringify(data));
        renderStatus('Cleared S.dbgUsed and saved "99g1c-v1".');
      } else {
        renderStatus('S.dbgUsed was already absent/cleared.');
      }
    }

    document.getElementById('clearBtn').addEventListener('click', clearDbgUsed);
    document.getElementById('refreshBtn').addEventListener('click', () => renderStatus());
    renderStatus();
  </script>
</body>
</html>
